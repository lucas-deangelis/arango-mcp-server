# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['dist/index.js', config.databaseUrl, config.username || '', config.password || ''] })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - databaseUrl
    properties:
      databaseUrl:
        type: string
        description: URL of the ArangoDB server, e.g., http://localhost:8529
      username:
        type: string
        description: Username for ArangoDB authentication
      password:
        type: string
        description: Password for ArangoDB authentication
  exampleConfig:
    databaseUrl: http://localhost:8529
    username: root
    password: password
